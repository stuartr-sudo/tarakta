app = "tarakta-mm-inverse"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  LOG_LEVEL = "INFO"
  LOG_FORMAT = "json"
  PORT = "8080"
  BOT_ROLE = "inverse_mirror"
  INSTANCE_ID = "tarakta-mm-inverse"
  MM_DASHBOARD_STRATEGY = "mm_inverse"
  INVERSE_SOURCE_INSTANCE_ID = "tarakta-mm"
  INVERSE_INSTANCE_ID = "tarakta-mm-inverse"
  INVERSE_SOURCE_STRATEGY = "mm_method"
  INVERSE_STRATEGY_TAG = "mm_inverse"
  INVERSE_POLL_INTERVAL_SECONDS = "15"
  INVERSE_QUANTITY_MULTIPLIER = "1"
  MM_SANITY_AGENT_ENABLED = "false"
  MM_METHOD_ENABLED = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"

[checks]
  [checks.health]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/health"
    port = 8080
    timeout = "10s"
    type = "http"
